name: CI - Backend and Frontend

on:
  pull_request:
    branches: [master]
  push:
    branches: [test/integration-three-roles]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Spring Boot tests (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and test Backend with H2
        run: mvn -B -ntp -f backend/pom.xml clean test

  mysql-integration:
    name: Spring Boot integration tests (MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_test_only_password
          MYSQL_DATABASE: sinhviendb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_test_only_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run integration tests against MySQL
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/sinhviendb_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ci_test_only_password
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
        run: mvn -B -ntp -f backend/pom.xml clean test

  frontend:
    name: React production build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sinhvien-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sinhvien-frontend/package-lock.json
      - name: Remove committed node_modules and install clean dependencies
        run: |
          rm -rf node_modules
          npm install --no-audit --no-fund
      - name: Compile React production build
        run: CI=true npm run build
