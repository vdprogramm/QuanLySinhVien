name: CI - Backend and Frontend

on:
  pull_request:
    branches: [master]
  push:
    branches: [test/integration-three-roles]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Spring Boot tests (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and test Backend with H2
        run: mvn -B -ntp -f backend/pom.xml clean test

  frontend:
    name: React production build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sinhvien-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sinhvien-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile React production build
        run: CI=true npm run build
