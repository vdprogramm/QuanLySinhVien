spring.application.name=quan-ly-sinh-vien
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/sinhviendb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.jpa.show-sql=false
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=43200000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.seed-demo=${APP_SEED_DEMO:false}
app.demo-password=${APP_DEMO_PASSWORD:}
