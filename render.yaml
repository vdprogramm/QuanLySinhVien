# Render Blueprint: Spring Boot backend only.
# The database remains MySQL and must be hosted separately with an address reachable from Render.
# Render does NOT provision a MySQL database with this file.
services:
  - type: web
    name: qlsv-backend
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_SEED_DEMO
        value: "false"
      - key: APP_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: APP_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Full JDBC URL: jdbc:mysql://<public-db-host>:3306/<database>?sslMode=REQUIRED
      - key: DATABASE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Exact Vercel domain, e.g. https://qlsv-frontend.vercel.app (without trailing slash)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
