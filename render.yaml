# Render Blueprint: backend Spring Boot + a new empty Postgres database.
# MySQL remains supported locally via the default Spring profile.
# Render free Postgres expires after 30 days; use a durable database for long-term data.
databases:
  - name: qlsv-postgres
    databaseName: qlsv
    user: qlsv_app
    plan: free
    region: singapore
    ipAllowList: []

services:
  - type: web
    name: qlsv-backend
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_SEED_DEMO
        value: "false"
      - key: APP_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: APP_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: qlsv-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: qlsv-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: qlsv-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: qlsv-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: qlsv-postgres
          property: password
      - key: CORS_ALLOWED_ORIGINS
        sync: false
